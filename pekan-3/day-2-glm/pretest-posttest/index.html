<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretest & Post-test · BPJS Data Analytics Training</title>
<style>
/* Tema biru (selaras dengan halaman Clustering). --g = warna aksen utama. */
:root{--bg:#F4F6FA;--card:#fff;--ink:#1B2430;--mute:#5F6E84;--line:#DCE3EE;--g:#2158A6;--gd:#17437F;--sel:#EAF1FB;--navy:#0B1E3C;--ok:#1E8E5A;--oksel:#E6F4EC;--err:#C0392B;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0A1424;--card:#101E35;--ink:#E6EDF8;--mute:#9DB0CC;--line:#223756;--g:#7FA4FF;--gd:#9DB9FF;--sel:#14284A;--navy:#0B1E3C;--ok:#43CFA6;--oksel:#12302A;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.55 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.hero{background:linear-gradient(135deg,#0B1E3C 0%,#132B63 50%,#2158A6 100%);color:#fff;padding:28px 16px 64px}
.hero .in{max-width:760px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9FC3F5;font-weight:600}
.hero h1{color:#fff;margin:6px 0 4px;font-size:1.9rem}
.hero p{margin:0;color:#C9D6EA}
main{max-width:760px;margin:-40px auto 0;padding:0 16px 64px}
h1{font-weight:700;font-size:1.6rem;line-height:1.2;margin:0 0 6px}
h2{font-weight:700;font-size:1.2rem;margin:0 0 4px;color:var(--navy)}
@media(prefers-color-scheme:dark){h2{color:var(--ink)}}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(11,30,60,.06),0 6px 24px rgba(11,30,60,.06)}
label{display:block;font-weight:600;margin:0 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,.opt:focus-within{outline:3px solid var(--g);outline-offset:2px}
.row{margin-bottom:14px}
button{font:600 1rem inherit;font-family:inherit;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0A1424}}
button:hover{background:var(--gd)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);margin:8px 0 0;min-height:1.2em}
.q{scroll-margin-top:12px}
.q p{margin:0 0 10px}
.num{font-weight:700;color:var(--g)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.45 Consolas,Menlo,monospace;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--g)}
.opt.on{background:var(--sel);border-color:var(--g)}
.opt input{margin-top:5px;accent-color:var(--g)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;font-weight:600;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.95rem}
.prog{height:6px;background:var(--line);border-radius:3px;flex:1;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.hide{display:none}
.big{font-weight:800;font-size:2.6rem;color:var(--g);margin:6px 0}
.rv{border-left:5px solid var(--line)}
.rv.ok{border-left-color:var(--ok)}
.rv.no{border-left-color:var(--err)}
.tag{font-weight:700}
.ok .tag{color:var(--ok)}.no .tag{color:var(--err)}
.rv .opt{cursor:default}
.rv .opt:not(.k):not(.w):hover{border-color:var(--line)}
.rv .opt.k{background:var(--oksel);border-color:var(--ok)}
.rv .opt.w{border-color:var(--err)}
.pb{margin:8px 0 0;color:var(--mute);font-size:.95rem}
.pb p{margin:6px 0 0}
code{font:.9em Consolas,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
pre.r{border-left:4px solid var(--g)}
pre.o{color:var(--mute)}
.opt{font-weight:400}
.opt span{min-width:0}
.sec{font-weight:700;font-size:1.1rem;color:var(--ink);margin:26px 0 10px;padding:8px 12px;border-left:5px solid var(--g);background:var(--sel);border-radius:6px}
.ctx{border-style:dashed}
.ctx p{margin:0 0 10px}
.ctx pre:last-child{margin-bottom:0}
.qt{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-left:6px}
.q p.fig,.rv p.fig{text-align:center}
.fig img{max-width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line)}
.pet ul{margin:6px 0 0;padding-left:20px}.pet li{margin:4px 0}.pet p{margin:0}
.warn{border-left:5px solid var(--err)}
</style>
</head>
<body>
<header class="hero"><div class="in">
  <div class="eyebrow">BPJS Data Analytics Training · Generalized Linear Models (GLM)</div>
  <h1 id="ttitle">Pretest &amp; Post-test</h1>
  <p>15 soal pilihan ganda (A–D) · 20 menit · membaca output R</p>
</div></header>
<main>

<section id="gate">
  <div class="card">
    <form id="gform" autocomplete="off">
      <div class="row">
        <label for="pw">Password</label>
        <input type="password" id="pw" placeholder="Masukkan password dari trainer" required>
      </div>
      <button type="submit">Buka tes</button>
      <p class="err" id="gerr" role="alert"></p>
    </form>
  </div>
</section>

<section id="test" class="hide">
  <div class="card pet" id="pet"></div>
  <div class="card">
    <div class="row"><label for="nama">Nama</label><input type="text" id="nama" required></div>
    <div class="row" style="margin:0"><label for="email">Email</label><input type="email" id="email" required></div>
  </div>
  <div class="bar"><span id="count">0 / 15 terjawab</span><div class="prog"><i id="pbar"></i></div></div>
  <div id="qs"></div>
  <button id="send" type="button">Kumpulkan jawaban</button>
  <p class="err" id="terr" role="alert"></p>
</section>

<section id="done" class="hide">
  <div class="card">
    <h2>Jawaban terkirim</h2>
    <p id="dmsg" class="sub" style="margin:0"></p>
    <div class="big" id="dscore"></div>
    <p class="sub" id="dnote" style="margin:0">Pembahasan di bawah ini bisa dipakai untuk belajar. Terima kasih sudah mengisi.</p>
  </div>
  <div id="review"></div>
</section>

</main>
<script>
// === PENGATURAN ===
// Tempel URL Web App Google Apps Script (lihat petunjuk), misal "https://script.google.com/macros/s/XXXX/exec"
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6k8f4v0io7wLGcrJ5Av-iJivvXOwRIGiHqvibFNQK8pgrSOKZ7f9DBok1V95bLAY_Hw/exec";

// Password disimpan tidak terbaca langsung (dibalik + base64). Ini penghalang ringan, bukan keamanan kuat.
const PW = {
  "MXRzZXRlcnBnbmluaWFydHNqcGI=": "pretest",
  "MXRzZXR0c29wZ25pbmlhcnRzanBi": "posttest"
};
const enc = s => btoa(s.split("").reverse().join(""));

const TITLES = {pretest: "Pretest", posttest: "Post-test"};

// Soal GLM (stem & opsi berupa HTML dari file soal). Kunci dan pembahasan TIDAK ada di sini; dikirim server setelah peserta mengumpulkan.
const T = {"pretest": {"petunjuk": "<p><strong>Petunjuk<\/strong><\/p> <ul> <li>Pretest ini dikerjakan <strong>sebelum<\/strong> sesi hands-on, untuk mengukur pemahaman awal. Tidak memengaruhi penilaian.<\/li> <li>Waktu <strong>20 menit<\/strong>, 15 soal pilihan ganda, pilih <strong>satu<\/strong> jawaban yang paling tepat (A–D).<\/li> <li>Semua output adalah output R asli dari data <code>dataCar<\/code> (67.856 polis asuransi kendaraan). Variabel: <code>veh_value<\/code> (nilai kendaraan, ×10.000 AUD), <code>veh_age<\/code> (kelompok umur kendaraan 1–4), <code>gender<\/code> (F/M), <code>agecat<\/code> (kelompok usia pengemudi 1–6), <code>exposure<\/code> (lama polis aktif, 0–1 tahun), <code>clm<\/code> (1 = ada klaim), <code>numclaims<\/code> (jumlah klaim), <code>claimcst0<\/code> (biaya klaim, AUD).<\/li> <li>Gunakan α = 5% bila soal menanyakan signifikansi.<\/li> <\/ul>", "items": [{"t": "sec", "h": "Bagian A · Memilih model dan fungsi R dasar"}, {"t": "q", "no": 1, "tag": "Memilih model", "h": "<p>Seorang analis ingin memodelkan <strong>jumlah klaim<\/strong> tiap polis (<code>numclaims<\/code>, bernilai 0, 1, 2, …). Model manakah yang paling sesuai sebagai model awal?<\/p>", "o": ["Regresi Linear dengan <code>lm()<\/code>", "Regresi Poisson dengan link log", "Regresi Logistik dengan link logit", "Regresi Gamma dengan link log"]}, {"t": "q", "no": 2, "tag": "Menulis kode model", "h": "<p>Variabel <code>clm<\/code> bernilai 1 jika polis mengajukan klaim dan 0 jika tidak. Kode R manakah yang memasang <strong>regresi logistik<\/strong> dengan benar?<\/p>", "o": ["<code>lm(clm ~ veh_value + agecat, data = dataCar)<\/code>", "<code>glm(clm ~ veh_value + agecat, data = dataCar, family = poisson)<\/code>", "<code>glm(clm ~ veh_value + agecat, data = dataCar, family = binomial)<\/code>", "<code>glm(clm ~ veh_value + agecat, data = dataCar)<\/code>"]}, {"t": "q", "no": 3, "tag": "Fungsi R dasar", "h": "<p>Perhatikan output berikut.<\/p><pre class=\"r\">dim(dataCar)<\/pre><pre class=\"o\">#&gt; [1] 67856    11<\/pre><p>Apa arti output tersebut?<\/p>", "o": ["Data berisi 67.856 baris (polis) dan 11 kolom (variabel)", "Data berisi 11 baris dan 67.856 kolom", "Ada 67.856 nilai hilang (NA) yang tersebar pada 11 variabel", "Ada 67.856 klaim yang berasal dari 11 wilayah"]}, {"t": "sec", "h": "Bagian B · Regresi Linear"}, {"t": "ctx", "h": "<p>Output berikut dipakai untuk <strong>soal 4 dan 5<\/strong>.<\/p><pre class=\"r\">model_lm &lt;- lm(veh_value ~ veh_age + gender + agecat, data = dataCar)\nsummary(model_lm)<\/pre><pre class=\"o\">#&gt; \n#&gt; Call:\n#&gt; lm(formula = veh_value ~ veh_age + gender + agecat, data = dataCar)\n#&gt; \n#&gt; Residuals:\n#&gt;     Min      1Q  Median      3Q     Max \n#&gt; -2.9785 -0.5791 -0.2234  0.3479 31.5373 \n#&gt; \n#&gt; Coefficients:\n#&gt;              Estimate Std. Error t value Pr(&gt;|t|)    \n#&gt; (Intercept)  3.448329   0.014034  245.71   &lt;2e-16 ***\n#&gt; veh_age     -0.620219   0.003591 -172.73   &lt;2e-16 ***\n#&gt; genderM      0.327440   0.007747   42.27   &lt;2e-16 ***\n#&gt; agecat      -0.044268   0.002688  -16.47   &lt;2e-16 ***\n#&gt; ---\n#&gt; Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n#&gt; \n#&gt; Residual standard error: 0.9971 on 67852 degrees of freedom\n#&gt; Multiple R-squared:  0.3156, Adjusted R-squared:  0.3155 \n#&gt; F-statistic: 1.043e+04 on 3 and 67852 DF,  p-value: &lt; 2.2e-16<\/pre>"}, {"t": "q", "no": 4, "tag": "Tafsir koefisien Linear", "h": "<p>Bagaimana tafsir yang benar untuk koefisien <code>veh_age<\/code> = −0,620?<\/p>", "o": ["Setiap naik satu kelompok umur kendaraan, nilai kendaraan turun 62%", "Setiap naik satu kelompok umur kendaraan, odds nilai kendaraan dikalikan 0,62", "Kendaraan dengan <code>veh_age<\/code> lebih tinggi punya peluang 0,62 lebih kecil untuk bernilai tinggi", "Dengan predictor lain tetap, setiap naik satu kelompok umur kendaraan, rata-rata <code>veh_value<\/code> turun 0,620 satuan (≈ 6.200 AUD)"]}, {"t": "q", "no": 5, "tag": "Ukuran kecocokan", "h": "<p>Pada output di atas tertulis <code>Multiple R-squared: 0.3156<\/code>. Apa artinya?<\/p>", "o": ["31,56% polis diprediksi dengan tepat oleh model", "31,56% variasi <code>veh_value<\/code> dapat dijelaskan oleh predictor dalam model", "Korelasi antara <code>veh_age<\/code> dan <code>veh_value<\/code> adalah 0,3156", "Rata-rata kesalahan prediksi model adalah 31,56%"]}, {"t": "sec", "h": "Bagian C · Regresi Logistik"}, {"t": "ctx", "h": "<p>Output dan model berikut dipakai untuk <strong>soal 6–9<\/strong>.<\/p><pre class=\"r\">model_logit &lt;- glm(clm ~ veh_value + veh_age + gender + agecat,\n                   data = dataCar, family = binomial)\nsummary(model_logit)<\/pre><pre class=\"o\">#&gt; \n#&gt; Call:\n#&gt; glm(formula = clm ~ veh_value + veh_age + gender + agecat, family = binomial, \n#&gt;     data = dataCar)\n#&gt; \n#&gt; Coefficients:\n#&gt;             Estimate Std. Error z value Pr(&gt;|z|)    \n#&gt; (Intercept) -2.37193    0.07346 -32.287  &lt; 2e-16 ***\n#&gt; veh_value    0.04565    0.01392   3.279  0.00104 ** \n#&gt; veh_age     -0.01393    0.01688  -0.825  0.40927    \n#&gt; genderM     -0.01686    0.03127  -0.539  0.58975    \n#&gt; agecat      -0.08275    0.01079  -7.668 1.74e-14 ***\n#&gt; ---\n#&gt; Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n#&gt; \n#&gt; (Dispersion parameter for binomial family taken to be 1)\n#&gt; \n#&gt;     Null deviance: 33767  on 67855  degrees of freedom\n#&gt; Residual deviance: 33684  on 67851  degrees of freedom\n#&gt; AIC: 33694\n#&gt; \n#&gt; Number of Fisher Scoring iterations: 5<\/pre>"}, {"t": "q", "no": 6, "tag": "Signifikansi", "h": "<p>Pada α = 5%, variabel manakah yang <strong>tidak<\/strong> signifikan?<\/p>", "o": ["<code>veh_value<\/code> dan <code>agecat<\/code>", "Hanya <code>genderM<\/code>", "<code>veh_age<\/code> dan <code>genderM<\/code>", "Tidak ada; semua variabel signifikan"]}, {"t": "q", "no": 7, "tag": "Odds ratio", "h": "<pre class=\"r\">exp(coef(model_logit)[\"agecat\"])<\/pre><pre class=\"o\">#&gt;    agecat \n#&gt; 0.9205768<\/pre><p>Bagaimana tafsir yang benar untuk nilai tersebut?<\/p>", "o": ["Dengan predictor lain tetap, setiap naik satu kelompok usia pengemudi, <strong>odds<\/strong> klaim dikalikan 0,921 (turun sekitar 7,9%)", "Setiap naik satu kelompok usia pengemudi, peluang klaim turun 92,1%", "Peluang klaim pengemudi adalah 92,1%", "Setiap naik satu kelompok usia pengemudi, odds klaim berkurang 0,921 satuan"]}, {"t": "q", "no": 8, "tag": "Kecocokan model", "h": "<p>Perhatikan baris <code>Null deviance<\/code> dan <code>Residual deviance<\/code> pada output di atas. Pernyataan manakah yang benar?<\/p>", "o": ["Residual deviance yang lebih kecil berarti model ini lebih buruk daripada model tanpa predictor", "Null deviance adalah deviance dari model yang paling lengkap", "Selisih derajat bebas (67855 − 67851 = 4) berarti ada 4 observasi yang dibuang", "Null deviance adalah deviance model yang hanya berisi intercept; penurunannya menjadi residual deviance menunjukkan predictor memperbaiki model"]}, {"t": "q", "no": 9, "tag": "Prediksi", "h": "<pre class=\"r\">polis_baru &lt;- data.frame(veh_value = 2, veh_age = 2, gender = \"F\", agecat = 3)\npredict(model_logit, newdata = polis_baru, type = \"response\")<\/pre><pre class=\"o\">#&gt;          1 \n#&gt; 0.07197486<\/pre><p>Apa arti nilai yang dihasilkan?<\/p>", "o": ["Log-odds klaim untuk polis tersebut", "Peluang polis tersebut mengajukan klaim, sekitar 7,2%", "Odds ratio polis tersebut dibanding polis lain", "Jumlah klaim yang diharapkan per tahun"]}, {"t": "sec", "h": "Bagian D · Regresi Poisson"}, {"t": "ctx", "h": "<p>Model berikut dipakai untuk <strong>soal 10, 11, dan 12<\/strong>.<\/p><pre class=\"r\">model_pois &lt;- glm(numclaims ~ veh_value + gender + agecat + offset(log(exposure)),\n                  data = dataCar, family = poisson)<\/pre>"}, {"t": "q", "no": 10, "tag": "Offset", "h": "<p>Apa fungsi <code>offset(log(exposure))<\/code> pada model di atas?<\/p>", "o": ["Membuang polis yang <code>exposure<\/code>-nya kecil", "Menjadikan <code>exposure<\/code> sebagai variabel response", "Memperhitungkan lama pertanggungan yang berbeda antar polis, sehingga yang dimodelkan adalah laju klaim per satuan exposure; koefisiennya tidak diestimasi (ditetapkan = 1)", "Mengatasi overdispersion pada data count"]}, {"t": "q", "no": 11, "tag": "Tafsir koefisien Poisson", "h": "<pre class=\"r\">exp(coef(model_pois))<\/pre><pre class=\"o\">#&gt; (Intercept)   veh_value     genderM      agecat \n#&gt;   0.1952942   1.0501721   0.9615458   0.9155038<\/pre><p>Bagaimana tafsir yang benar untuk nilai <code>agecat<\/code>?<\/p>", "o": ["Peluang klaim pengemudi adalah 91,6%", "Setiap naik satu kelompok usia, jumlah klaim berkurang 0,916 klaim", "Setiap naik satu kelompok usia, odds klaim dikalikan 0,916", "Dengan predictor lain dan exposure tetap, setiap naik satu kelompok usia, frekuensi klaim yang diharapkan dikalikan 0,916 (turun sekitar 8,4%)"]}, {"t": "q", "no": 12, "tag": "Overdispersion", "h": "<pre class=\"r\">sum(residuals(model_pois, type = \"pearson\")^2) / df.residual(model_pois)<\/pre><pre class=\"o\">#&gt; [1] 1.408926<\/pre><p>Apa kesimpulan yang tepat dari nilai dispersi Pearson tersebut?<\/p>", "o": ["Ada indikasi overdispersion (ragam lebih besar dari rata-rata), sehingga standard error Poisson cenderung terlalu kecil; bandingkan dengan Negative Binomial atau quasi-Poisson", "Ada underdispersion, sehingga model Poisson harus diganti regresi Linear", "Nilai di atas 1 berarti model Poisson cocok sempurna", "Model menjelaskan 40,9% variasi jumlah klaim"]}, {"t": "sec", "h": "Bagian E · Regresi Gamma dan pemeriksaan asumsi"}, {"t": "q", "no": 13, "tag": "Tafsir koefisien Gamma", "h": "<p>Model Gamma dipasang pada polis yang biaya klaimnya positif.<\/p><pre class=\"r\">data_gamma  &lt;- subset(dataCar, claimcst0 &gt; 0)\nmodel_gamma &lt;- glm(claimcst0 ~ veh_age + gender + agecat,\n                   data = data_gamma, family = Gamma(link = \"log\"))\nround(coef(summary(model_gamma)), 4)<\/pre><pre class=\"o\">#&gt;             Estimate Std. Error t value Pr(&gt;|t|)\n#&gt; (Intercept)   7.6284     0.0919 83.0170   0.0000\n#&gt; veh_age       0.0465     0.0244  1.9040   0.0570\n#&gt; genderM       0.1831     0.0518  3.5345   0.0004\n#&gt; agecat       -0.0694     0.0181 -3.8398   0.0001<\/pre><pre class=\"r\">exp(coef(model_gamma)[\"genderM\"])<\/pre><pre class=\"o\">#&gt;  genderM \n#&gt; 1.200985<\/pre><p>Bagaimana tafsir yang benar untuk <code>genderM<\/code>?<\/p>", "o": ["Biaya klaim pengemudi pria lebih tinggi 0,183 AUD daripada wanita", "Dengan predictor lain tetap, rata-rata biaya klaim pengemudi pria sekitar 1,20 kali (20% lebih tinggi dari) pengemudi wanita sebagai kategori pembanding", "Odds klaim pengemudi pria 1,20 kali odds klaim wanita", "Pengemudi pria 18,3% lebih mungkin mengajukan klaim"]}, {"t": "q", "no": 14, "tag": "Uji asumsi", "h": "<p>Uji berikut dijalankan pada model Linear di Bagian B.<\/p><pre class=\"r\">bptest(model_lm)<\/pre><pre class=\"o\">#&gt; \n#&gt;  studentized Breusch-Pagan test\n#&gt; \n#&gt; data:  model_lm\n#&gt; BP = 855.03, df = 3, p-value &lt; 2.2e-16<\/pre><p>Apa kesimpulan yang tepat?<\/p>", "o": ["Residual berdistribusi Normal", "Tidak ada multikolinearitas antar predictor", "H₀ (ragam residual konstan) ditolak, artinya ada heteroskedastisitas", "H₀ gagal ditolak, artinya asumsi homoskedastisitas terpenuhi"]}, {"t": "q", "no": 15, "tag": "Membaca plot diagnostik", "h": "<pre class=\"r\">plot(model_lm, which = 2)<\/pre><p class=\"fig\"><img alt=\"Plot diagnostik\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDgAAAL0CAIAAABmiBAtAAAACXBIWXMAABuuAAAbrgGMXXP4AAAgAElEQVR4nOzdd3xN9x/H8e8592Zvm0QESYi9Z+xZq/ZWqvyotkartHZbtWcVLVrUVqr23jMIsYk9IolIZK977zm/PyIaIeSaB6/nf797z/l+P+f++mjPO98lqaoqAAAAAEBL5LddAAAAAACkR1ABAAAAoDkEFQAAAACaQ1ABAAAAoDkEFQAAAACaQ1ABAAAAoDkEFQAAAACaQ1ABAAAAoDkEFQAAAACaQ1ABAAAAo de>veh_value<\/code> (nilai kendaraan, ×10.000 AUD), <code>veh_age<\/code> (kelompok umur kendaraan 1–4), <code>gender<\/code> (F/M), <code>area<\/code> (wilayah A–F), <code>agecat<\/code> (kelompok usia pengemudi 1–6), <code>exposure<\/code> (lama polis aktif, 0–1 tahun), <code>clm<\/code> (1 = ada klaim), <code>numclaims<\/code> (jumlah klaim), <code>claimcst0<\/code> (biaya klaim, AUD).<\/li> <li>Gunakan α = 5% bila soal menanyakan signifikansi.<\/li> <\/ul>", "items": [{"t": "sec", "h": "Bagian A · Memilih model dan fungsi R dasar"}, {"t": "q", "no": 1, "tag": "Memilih model", "h": "<p>Seorang analis ingin memodelkan <strong>besar biaya klaim<\/strong> (<code>claimcst0<\/code>) pada polis yang mengajukan klaim. Datanya kontinu, selalu positif, dan sangat miring ke kanan. Model manakah yang paling sesuai?<\/p>", "o": ["Regresi Poisson dengan link log", "Regresi Logistik dengan link logit", "Regresi Gamma dengan link log", "Regresi Linear tanpa transformasi"]}, {"t": "q", "no": 2, "tag": "Menulis kode model", "h": "<p><code>data_gamma<\/code> berisi polis dengan biaya klaim positif. Kode R manakah yang memasang <strong>regresi Gamma dengan link log<\/strong> dengan benar?<\/p>", "o": ["<code>glm(claimcst0 ~ gender + agecat, data = data_gamma, family = Gamma(link = \"log\"))<\/code>", "<code>glm(claimcst0 ~ gender + agecat, data = data_gamma, family = gamma)<\/code>", "<code>glm(claimcst0 ~ gender + agecat, data = data_gamma, family = poisson(link = \"log\"))<\/code>", "<code>lm(claimcst0 ~ gender + agecat, data = data_gamma, family = Gamma)<\/code>"]}, {"t": "q", "no": 3, "tag": "Fungsi R dasar", "h": "<p>Perhatikan output berikut.<\/p><pre class=\"r\">table(dataCar$numclaims)<\/pre><pre class=\"o\">#&gt; \n#&gt;     0     1     2     3     4 \n#&gt; 63232  4333   271    18     2<\/pre><p>Pernyataan manakah yang benar?<\/p>", "o": ["Ada 4 polis, dengan jumlah klaim terbanyak 63.232", "Rata-rata jumlah klaim per polis adalah 2", "Sebanyak 63.232 polis mengajukan klaim", "Sebanyak 63.232 polis tidak pernah klaim, dan 271 polis mengajukan tepat dua klaim"]}, {"t": "sec", "h": "Bagian B · Regresi Linear"}, {"t": "ctx", "h": "<p>Output berikut dipakai untuk <strong>soal 4 dan 5<\/strong>.<\/p><pre class=\"r\">model_lm &lt;- lm(veh_value ~ veh_age + gender + exposure, data = dataCar)\nsummary(model_lm)<\/pre><pre class=\"o\">#&gt; \n#&gt; Call:\n#&gt; lm(formula = veh_value ~ veh_age + gender + exposure, data = dataCar)\n#&gt; \n#&gt; Residuals:\n#&gt;     Min      1Q  Median      3Q     Max \n#&gt; -3.0399 -0.5845 -0.2346  0.3543 31.5340 \n#&gt; \n#&gt; Coefficients:\n#&gt;              Estimate Std. Error  t value Pr(&gt;|t|)    \n#&gt; (Intercept)  3.266266   0.012201  267.705  &lt; 2e-16 ***\n#&gt; veh_age     -0.621859   0.003599 -172.789  &lt; 2e-16 ***\n#&gt; genderM      0.321068   0.007753   41.410  &lt; 2e-16 ***\n#&gt; exposure     0.074468   0.013232    5.628 1.83e-08 ***\n#&gt; ---\n#&gt; Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n#&gt; \n#&gt; Residual standard error: 0.9989 on 67852 degrees of freedom\n#&gt; Multiple R-squared:  0.3131, Adjusted R-squared:  0.3131 \n#&gt; F-statistic: 1.031e+04 on 3 and 67852 DF,  p-value: &lt; 2.2e-16<\/pre>"}, {"t": "q", "no": 4, "tag": "Tafsir koefisien Linear", "h": "<p>Bagaimana tafsir yang benar untuk koefisien <code>genderM<\/code> = 0,321?<\/p>", "o": ["Nilai kendaraan pengemudi pria 32,1% lebih tinggi daripada wanita", "Dengan predictor lain tetap, rata-rata <code>veh_value<\/code> pengemudi pria lebih tinggi 0,321 satuan (≈ 3.210 AUD) daripada pengemudi wanita sebagai kategori pembanding", "Setiap bertambah satu pengemudi pria, nilai kendaraan naik 0,321 satuan", "Rata-rata <code>veh_value<\/code> pengemudi wanita lebih tinggi 0,321 satuan daripada pria"]}, {"t": "q", "no": 5, "tag": "Ukuran kecocokan", "h": "<p>Baris terakhir output di atas adalah <code>F-statistic: 1.031e+04 on 3 and 67852 DF, p-value: &lt; 2.2e-16<\/code>. Apa artinya?<\/p>", "o": ["Setiap koefisien signifikan secara individu", "Residual model berdistribusi Normal", "H₀ bahwa semua koefisien predictor sama dengan nol ditolak; minimal satu predictor berpengaruh terhadap <code>veh_value<\/code>", "Model menjelaskan hampir 100% variasi <code>veh_value<\/code>"]}, {"t": "sec", "h": "Bagian C · Regresi Logistik"}, {"t": "ctx", "h": "<p>Output dan model berikut dipakai untuk <strong>soal 6–9<\/strong>.<\/p><pre class=\"r\">model_logit &lt;- glm(clm ~ exposure + veh_value + gender + agecat,\n                   data = dataCar, family = binomial)\nsummary(model_logit)<\/pre><pre class=\"o\">#&gt; \n#&gt; Call:\n#&gt; glm(formula = clm ~ exposure + veh_value + gender + agecat, family = binomial, \n#&gt;     data = dataCar)\n#&gt; \n#&gt; Coefficients:\n#&gt;             Estimate Std. Error z value Pr(&gt;|z|)    \n#&gt; (Intercept) -3.37254    0.05656 -59.626  &lt; 2e-16 ***\n#&gt; exposure     1.85878    0.05470  33.982  &lt; 2e-16 ***\n#&gt; veh_value    0.05386    0.01191   4.523 6.11e-06 ***\n#&gt; genderM     -0.03588    0.03133  -1.145    0.252    \n#&gt; agecat      -0.09398    0.01092  -8.606  &lt; 2e-16 ***\n#&gt; ---\n#&gt; Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n#&gt; \n#&gt; (Dispersion parameter for binomial family taken to be 1)\n#&gt; \n#&gt;     Null deviance: 33767  on 67855  degrees of freedom\n#&gt; Residual deviance: 32468  on 67851  degrees of freedom\n#&gt; AIC: 32478\n#&gt; \n#&gt; Number of Fisher Scoring iterations: 6<\/pre>"}, {"t": "q", "no": 6, "tag": "Signifikansi", "h": "<p>Pada α = 5%, variabel manakah yang <strong>tidak<\/strong> signifikan?<\/p>", "o": ["Hanya <code>genderM<\/code>", "<code>exposure<\/code> dan <code>genderM<\/code>", "<code>veh_value<\/code>", "<code>agecat<\/code>"]}, {"t": "q", "no": 7, "tag": "Odds ratio", "h": "<pre class=\"r\">exp(coef(model_logit)[\"veh_value\"])<\/pre><pre class=\"o\">#&gt; veh_value \n#&gt;  1.055341<\/pre><p>Bagaimana tafsir yang benar untuk nilai tersebut?<\/p>", "o": ["Setiap naik 1 satuan <code>veh_value<\/code>, peluang klaim naik 5,5 poin persen", "Peluang klaim untuk kendaraan bernilai 1 satuan adalah 1,055", "Setiap naik 1 satuan <code>veh_value<\/code>, odds klaim bertambah 0,054 satuan", "Dengan predictor lain tetap, setiap naik 1 satuan <code>veh_value<\/code> (10.000 AUD), <strong>odds<\/strong> klaim dikalikan 1,055 (naik sekitar 5,5%)"]}, {"t": "q", "no": 8, "tag": "Kecocokan model", "h": "<p><code>model_A<\/code> adalah model di atas (dengan <code>gender<\/code>), sedangkan <code>model_B<\/code> adalah model yang sama <strong>tanpa<\/strong> <code>gender<\/code>.<\/p><pre class=\"r\">model_A &lt;- model_logit\nmodel_B &lt;- glm(clm ~ exposure + veh_value + agecat, data = dataCar, family = binomial)\nAIC(model_A, model_B)<\/pre><pre class=\"o\">#&gt;         df      AIC\n#&gt; model_A  5 32478.01\n#&gt; model_B  4 32477.33<\/pre><pre class=\"r\">anova(model_B, model_A, test = \"Chisq\")<\/pre><pre class=\"o\">#&gt; Analysis of Deviance Table\n#&gt; \n#&gt; Model 1: clm ~ exposure + veh_value + agecat\n#&gt; Model 2: clm ~ exposure + veh_value + gender + agecat\n#&gt;   Resid. Df Resid. Dev Df Deviance Pr(&gt;Chi)\n#&gt; 1     67852      32469                     \n#&gt; 2     67851      32468  1   1.3134   0.2518<\/pre><p>Apa kesimpulan yang tepat?<\/p>", "o": ["Pilih <code>model_A<\/code> karena derajat bebasnya (<code>df<\/code>) lebih besar", "Pilih <code>model_B<\/code>: AIC-nya lebih kecil dan uji rasio likelihood (p = 0,25) menunjukkan <code>gender<\/code> tidak memperbaiki model secara berarti", "Pilih <code>model_A<\/code> karena AIC-nya lebih besar", "Kedua model tidak dapat dibandingkan karena jumlah variabelnya berbeda"]}, {"t": "q", "no": 9, "tag": "Prediksi", "h": "<pre class=\"r\">polis_baru &lt;- data.frame(exposure = 0.8, veh_value = 2, gender = \"M\", agecat = 1)\npredict(model_logit, newdata = polis_baru)<\/pre><pre class=\"o\">#&gt;         1 \n#&gt; -1.907645<\/pre><p>Hasilnya negatif. Apa penjelasan yang tepat?<\/p>", "o": ["Tanpa argumen <code>type<\/code>, <code>predict()<\/code> mengembalikan nilai pada skala link (log-odds); peluangnya adalah <code>plogis(-1.9076)<\/code> ≈ 0,129, atau gunakan <code>type = \"response\"<\/code>", "Peluang tidak mungkin negatif, sehingga model ini salah dan harus dipasang ulang", "Nilai tersebut adalah odds ratio polis itu dibanding polis lain", "Nilai tersebut adalah jumlah klaim yang diharapkan"]}, {"t": "sec", "h": "Bagian D · Regresi Poisson dan Negative Binomial"}, {"t": "ctx", "h": "<p>Model berikut dipakai untuk <strong>soal 10, 11, dan 12<\/strong>.<\/p><pre class=\"r\">model_pois &lt;- glm(numclaims ~ veh_age + gender + agecat + offset(log(exposure)),\n                  data = dataCar, family = poisson)<\/pre>"}, {"t": "q", "no": 10, "tag": "Offset", "h": "<pre class=\"r\">profil &lt;- data.frame(veh_age = 2, gender = \"F\", agecat = 3, exposure = 1)\npredict(model_pois, newdata = profil, type = \"response\")<\/pre><pre class=\"o\">#&gt;        1 \n#&gt; 0.169111<\/pre><p>Jika <code>exposure<\/code> pada <code>profil<\/code> diganti menjadi <code>0.5<\/code> (polis aktif setengah tahun), berapa hasil prediksinya?<\/p>", "o": ["Tetap 0,169 karena offset tidak memengaruhi prediksi", "0,338 (dua kalinya)", "0,411 (akar dari 0,169)", "0,085 (separuhnya), karena harapan klaim = exposure × laju klaim per tahun"]}, {"t": "q", "no": 11, "tag": "Tafsir koefisien Poisson", "h": "<pre class=\"r\">exp(coef(model_pois))<\/pre><pre class=\"o\">#&gt; (Intercept)     veh_age     genderM      agecat \n#&gt;   0.2498041   0.9411310   0.9813652   0.9143043<\/pre><p>Berdasarkan nilai <code>veh_age<\/code>, pernyataan manakah yang benar?<\/p>", "o": ["Setiap naik satu kelompok umur kendaraan, frekuensi klaim naik 94,1%", "Dengan predictor lain dan exposure tetap, setiap naik satu kelompok umur kendaraan, frekuensi klaim yang diharapkan turun sekitar 5,9%", "Setiap naik satu kelompok umur kendaraan, frekuensi klaim turun 94,1%", "Setiap naik satu kelompok umur kendaraan, jumlah klaim berkurang 0,94 klaim"]}, {"t": "q", "no": 12, "tag": "Overdispersion", "h": "<p>Model Negative Binomial dipasang dengan predictor yang sama.<\/p><pre class=\"r\">model_nb &lt;- glm.nb(numclaims ~ veh_age + gender + agecat + offset(log(exposure)),\n                   data = dataCar)\nc(Theta = model_nb$theta, Std.Err = model_nb$SE.theta)<\/pre><pre class=\"o\">#&gt;     Theta   Std.Err \n#&gt; 2.1750134 0.3910385<\/pre><pre class=\"r\">AIC(model_pois, model_nb)<\/pre><pre class=\"o\">#&gt;            df      AIC\n#&gt; model_pois  4 34846.37\n#&gt; model_nb    5 34806.75<\/pre><p>Apa kesimpulan yang tepat?<\/p>", "o": ["Poisson lebih baik karena jumlah parameternya (<code>df<\/code>) lebih sedikit", "Theta = 2,175 berarti frekuensi klaim naik 2,175 kali", "Negative Binomial lebih baik: AIC-nya lebih kecil sekitar 40 poin, dan theta yang tidak terlalu besar menandakan adanya overdispersion yang tidak tertangkap Poisson", "Kedua model tidak dapat dibandingkan dengan AIC"]}, {"t": "sec", "h": "Bagian E · Regresi Gamma dan pemeriksaan asumsi"}, {"t": "q", "no": 13, "tag": "Tafsir koefisien Gamma", "h": "<p>Model Gamma dipasang pada polis yang biaya klaimnya positif.<\/p><pre class=\"r\">data_gamma  &lt;- subset(dataCar, claimcst0 &gt; 0)\nmodel_gamma &lt;- glm(claimcst0 ~ gender + area + agecat,\n                   data = data_gamma, family = Gamma(link = \"log\"))\nround(coef(summary(model_gamma)), 4)<\/pre><pre class=\"o\">#&gt;             Estimate Std. Error t value Pr(&gt;|t|)\n#&gt; (Intercept)   7.6824     0.0811 94.6802   0.0000\n#&gt; genderM       0.1765     0.0506  3.4884   0.0005\n#&gt; areaB        -0.0326     0.0752 -0.4327   0.6652\n#&gt; areaC         0.0726     0.0687  1.0574   0.2904\n#&gt; areaD        -0.0267     0.0922 -0.2899   0.7719\n#&gt; areaE         0.1534     0.1008  1.5222   0.1280\n#&gt; areaF         0.3620     0.1143  3.1655   0.0016\n#&gt; agecat       -0.0635     0.0177 -3.5754   0.0004<\/pre><pre class=\"r\">exp(coef(model_gamma)[\"areaF\"])<\/pre><pre class=\"o\">#&gt;    areaF \n#&gt; 1.436153<\/pre><p>Bagaimana tafsir yang benar untuk <code>areaF<\/code>?<\/p>", "o": ["Dengan predictor lain tetap, rata-rata biaya klaim di area F sekitar 1,44 kali (44% lebih tinggi dari) area A sebagai kategori pembanding", "Rata-rata biaya klaim di area F sekitar 1,44 kali area E, yaitu kategori tepat sebelumnya", "Biaya klaim di area F lebih tinggi 0,36 AUD daripada area A", "Peluang klaim di area F 43,6% lebih tinggi daripada area A"]}, {"t": "q", "no": 14, "tag": "Uji asumsi", "h": "<p>Uji berikut dijalankan pada residual model Linear di Bagian B (sampel acak 5.000 residual).<\/p><pre class=\"r\">set.seed(1)\nshapiro.test(sample(residuals(model_lm), 5000))<\/pre><pre class=\"o\">#&gt; \n#&gt;  Shapiro-Wilk normality test\n#&gt; \n#&gt; data:  sample(residuals(model_lm), 5000)\n#&gt; W = 0.81219, p-value &lt; 2.2e-16<\/pre><p>Apa kesimpulan yang tepat?<\/p>", "o": ["H₀ gagal ditolak, artinya residual berdistribusi Normal", "Ragam residual tidak konstan (heteroskedastisitas)", "Residual saling berkorelasi (autokorelasi)", "H₀ (residual berdistribusi Normal) ditolak, artinya asumsi normalitas tidak terpenuhi"]}, {"t": "q", "no": 15, "tag": "Membaca plot diagnostik", "h": "<pre class=\"r\">plot(model_lm, which = 3)<\/pre><p class=\"fig\"><img alt=\"Plot diagnostik\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDgAAAL0CAIAAABmiBAtAAAACXBIWXMAABuuAAAbrgGMXXP4AAAgAElEQVR4nOzdd3xN9x/H8e+5I0s2Mm2x94qViL1rFlWtmv3VKLVX1axZtKVoS63WKK09axOExh4hEkFIkBDZ4957fn+ENCKJ3JDk4PX849dfz/me7/mc82jr+77nfL9HkmVZAAAAAICSqPK6AAAAAABIi6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgAAAAAUh6ACAAAAQHEIKgA ig2IJUMZur6z6+cr5buTZP0+6EAiaoMzYu27PA/s5O8KmkiiFoD/IGxUCoQugLL5/M7XMaqBv/+b2rCcQXhyUlfn379zLLhRLkIGZpX2foZ5uFt31Fd3zpAuhHmVRSkxqCUOZunkPcxB0tjRdhdq8xLgchcMwLxcTEqcQ9AcJVAgEAoFAIBAIBEKXg8zeEggEAoFAIBAIhC4HCVQIBAKBQCAQCARCl4MEKgQCgUAgEAgEAqHL8f+tIpnyNMSbiAAAAABJRU5ErkJggg==\"><\/p><p>Apa yang ditunjukkan plot di atas?<\/p>", "o": ["Ragam residual konstan karena titik-titik tersebar merata", "Residual berdistribusi Normal", "Garis merah yang naik menunjukkan ragam residual membesar seiring nilai prediksi (heteroskedastisitas)", "Ada multikolinearitas antar predictor"]}]}};
const QS = t => T[t].items.filter(it => it.t === "q");
const VER = "glm-1";

const $ = id => document.getElementById(id);
// Pemanasan server Apps Script saat halaman dibuka, agar pengiriman jawaban lebih cepat.
try { if (/^https?:/.test(SCRIPT_URL)) fetch(SCRIPT_URL, {method: "GET", mode: "no-cors", cache: "no-store"}).catch(() => {}); } catch (e) {}
let cur = null, ans = [];

$("gform").addEventListener("submit", e => {
  e.preventDefault();
  const t = PW[enc($("pw").value.trim())];
  if (!t) { $("gerr").textContent = "Password salah. Periksa kembali password dari trainer."; return; }
  cur = t; ans = Array(15).fill("");
  render();
  $("gate").classList.add("hide"); $("test").classList.remove("hide");
  window.scrollTo(0, 0);
});

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function stem(it, i) {
  return `<p><span class="num">${i+1}.</span><span class="qt">${it.tag}</span></p>${it.h}`;
}
// Urutan tampil: judul bagian, blok output bersama (dipakai beberapa soal), lalu soal.
function layout(card) {
  let n = -1;
  return T[cur].items.map(it => {
    if (it.t === "sec") return `<h2 class="sec">${it.h}</h2>`;
    if (it.t === "ctx") return `<div class="card ctx">${it.h}</div>`;
    n++; return card(it, n);
  }).join("");
}

function render() {
  $("ttitle").textContent = TITLES[cur];
  document.title = TITLES[cur] + " GLM · BPJS Data Analytics Training";
  $("pet").innerHTML = T[cur].petunjuk;
  $("qs").innerHTML = layout((it, i) => `
    <div class="card q" id="q${i}">
      ${stem(it, i)}
      ${it.o.map((o, j) => `<label class="opt" data-i="${i}"><input type="radio" name="q${i}" value="${"ABCD"[j]}"><span><b>${"ABCD"[j]}.</b> ${o}</span></label>`).join("")}
    </div>`);
  $("qs").querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => {
    const i = +inp.name.slice(1);
    ans[i] = inp.value;
    document.querySelectorAll(`#q${i} .opt`).forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
    progress();
  }));
}

function progress() {
  const n = ans.filter(Boolean).length;
  $("count").textContent = n + " / 15 terjawab";
  $("pbar").style.width = (n / 15 * 100) + "%";
}

function showReview(d) {
  $("review").innerHTML = layout((it, i) => {
    const ok = ans[i] === d.key[i];
    return `<div class="card rv ${ok ? "ok" : "no"}">
      ${stem(it, i)}
      ${it.o.map((o, j) => { const L = "ABCD"[j];
        const c = L === d.key[i] ? "k" : (L === ans[i] ? "w" : "");
        const m = L === d.key[i] ? " ✓ kunci" : (L === ans[i] ? " ✗ jawaban Anda" : "");
        return `<div class="opt ${c}"><span><b>${L}.</b> ${o}<i>${m}</i></span></div>`; }).join("")}
      <div class="pb"><span class="tag">${ok ? "Benar" : "Salah"}</span> · Jawaban Anda: ${ans[i]}, kunci: ${d.key[i]}.${d.expl[i] || ""}</div>
    </div>`;
  });
}

$("send").addEventListener("click", async () => {
  const nama = $("nama").value.trim(), email = $("email").value.trim();
  const err = $("terr"); err.textContent = "";
  if (!nama) { err.textContent = "Isi nama terlebih dahulu."; $("nama").focus(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "Isi email dengan format yang benar."; $("email").focus(); return; }
  const k = ans.findIndex(a => !a);
  if (k >= 0) { err.textContent = `Soal nomor ${k+1} belum dijawab.`; $("q"+k).scrollIntoView({behavior:"smooth"}); return; }
  if (SCRIPT_URL.startsWith("PASTE_")) { err.textContent = "SCRIPT_URL belum diisi di file HTML (lihat petunjuk trainer)."; return; }

  const btn = $("send"); btn.disabled = true; btn.textContent = "Mengirim…";
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({test: cur, nama, email, answers: ans, ver: VER})
    });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || "Gagal menyimpan");
    $("test").classList.add("hide"); $("done").classList.remove("hide");
    if (d.ver !== VER) {
      // Code.gs di Apps Script belum diganti ke versi GLM: kunci di server masih kunci lama, jadi skor tidak ditampilkan.
      $("dmsg").textContent = `Jawaban ${TITLES[cur]} atas nama ${nama} sudah tercatat, tetapi skor belum bisa ditampilkan karena server penilaian belum diperbarui. Mohon sampaikan ke trainer.`;
      $("dscore").textContent = ""; document.querySelector("#done .card").classList.add("warn"); $("dnote").textContent = "Terima kasih sudah mengisi.";
      window.scrollTo(0, 0); return;
    }
    $("dmsg").textContent = `${TITLES[cur]} atas nama ${nama} sudah tercatat. Jawaban benar:`;
    $("dscore").textContent = `${d.correct} / ${d.total}  (skor ${d.score})`;
    showReview(d);
    window.scrollTo(0, 0);
  } catch (x) {
    err.textContent = "Pengiriman gagal. Periksa koneksi lalu coba lagi. Jawaban Anda masih tersimpan di halaman ini.";
    btn.disabled = false; btn.textContent = "Kumpulkan jawaban";
  }
});
</script>
</body>
</html>
