<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pretest & Post-test · BPJS Data Analytics Training</title>
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#17302a;--mute:#5d716a;--line:#d5e2dc;--g:#0b7a55;--gd:#075a3e;--sel:#e3f4ec;--err:#b3261e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a16;--card:#18271f;--ink:#e6f1ec;--mute:#9bb3a9;--line:#2c4238;--g:#3fbf8a;--gd:#2ea373;--sel:#1f3a2e;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.55 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font:700 1.6rem/1.25 Georgia,"Times New Roman",serif;margin:0 0 6px}
h2{font:700 1.2rem Georgia,serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin:0 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,.opt:focus-within{outline:3px solid var(--g);outline-offset:2px}
.row{margin-bottom:14px}
button{font:600 1rem inherit;font-family:inherit;background:var(--g);color:#fff;border:0;border-radius:8px;padding:11px 20px;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#0b1a13}}
button:hover{background:var(--gd)}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);margin:8px 0 0;min-height:1.2em}
.q{scroll-margin-top:12px}
.q p{margin:0 0 10px}
.num{font-weight:700;color:var(--g)}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:.85rem/1.45 Consolas,Menlo,monospace;margin:0 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--g)}
.opt.on{background:var(--sel);border-color:var(--g)}
.opt input{margin-top:5px;accent-color:var(--g)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.95rem}
.prog{height:6px;background:var(--line);border-radius:3px;flex:1;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.hide{display:none}
.big{font:700 3rem Georgia,serif;color:var(--g);margin:6px 0}
.rv{border-left:5px solid var(--line)}
.rv.ok{border-left-color:var(--g)}
.rv.no{border-left-color:var(--err)}
.tag{font-weight:700}
.ok .tag{color:var(--g)}.no .tag{color:var(--err)}
.rv .opt{cursor:default}
.rv .opt.k{background:var(--sel);border-color:var(--g)}
.rv .opt.w{border-color:var(--err)}
.pb{margin:8px 0 0;color:var(--mute);font-size:.95rem}
</style>
</head>
<body>
<main>

<section id="gate">
  <h1>Pretest & Post-test</h1>
  <p class="sub">BPJS Data Analytics Training · Clustering, PCA & MCA</p>
  <div class="card">
    <form id="gform" autocomplete="off">
      <div class="row">
        <label for="pw">Password</label>
        <input type="password" id="pw" placeholder="Masukkan password dari trainer" required>
      </div>
      <button type="submit">Buka tes</button>
      <p class="err" id="gerr" role="alert"></p>
    </form>
  </div>
</section>

<section id="test" class="hide">
  <h1 id="ttitle"></h1>
  <p class="sub">15 soal pilihan ganda (A–D), 10–15 menit. Pilih satu jawaban paling tepat. Kalkulator diperbolehkan.</p>
  <div class="card">
    <div class="row"><label for="nama">Nama</label><input type="text" id="nama" required></div>
    <div class="row" style="margin:0"><label for="email">Email</label><input type="email" id="email" required></div>
  </div>
  <div class="bar"><span id="count">0 / 15 terjawab</span><div class="prog"><i id="pbar"></i></div></div>
  <div id="qs"></div>
  <button id="send" type="button">Kumpulkan jawaban</button>
  <p class="err" id="terr" role="alert"></p>
</section>

<section id="done" class="hide">
  <div class="card">
    <h2>Jawaban terkirim</h2>
    <p id="dmsg" class="sub" style="margin:0"></p>
    <div class="big" id="dscore"></div>
    <p class="sub" style="margin:0">Pembahasan di bawah ini bisa dipakai untuk belajar. Terima kasih sudah mengisi.</p>
  </div>
  <div id="review"></div>
</section>

</main>
<script>
// === PENGATURAN ===
// Tempel URL Web App Google Apps Script (lihat petunjuk), misal "https://script.google.com/macros/s/XXXX/exec"
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzOX_m1vrESnIF0TT1guDcRRYIMran6p8gO5abeaaoQpKi2cX_H869ZP9jO954cv9r7Og/exec";

// Password disimpan tidak terbaca langsung (dibalik + base64). Ini penghalang ringan, bukan keamanan kuat.
const PW = {
  "MXRzZXRlcnBnbmluaWFydHNqcGI=": "pretest",
  "MXRzZXR0c29wZ25pbmlhcnRzanBi": "posttest"
};
const enc = s => btoa(s.split("").reverse().join(""));

const TITLES = {pretest: "Pretest", posttest: "Post-test"};

const Q = {
pretest: [
 {q:"Tim BPJS ingin mengelompokkan 5.000 peserta berdasarkan usia, jumlah kunjungan, dan biaya klaim. Belum ada label kelompok sebelumnya. Teknik yang paling tepat adalah …",o:["Regresi linear","Klasifikasi (decision tree)","Clustering","Uji-t dua sampel"]},
 {q:"Ringkasan data sebelum clustering:",pre:"      usia       kunjungan     biaya_klaim\n Min.   :18   Min.   : 0   Min.   :        0\n Max.   :80   Max.   :24   Max.   : 45000000",q2:"Mengapa data perlu di-scale() sebelum kmeans()?",o:["Agar biaya_klaim yang bernilai jutaan tidak mendominasi perhitungan jarak","Agar data berdistribusi normal","Agar jumlah cluster terpilih otomatis","Agar nilai NA terhapus"]},
 {q:"Nilai total WSS dari K-Means untuk k = 1 sampai 6:",pre:"k   :    1    2    3    4    5    6\nWSS : 1000  520  300  270  250  235",q2:"Berdasarkan metode elbow, jumlah cluster yang paling tepat adalah …",o:["k = 2","k = 5","k = 6","k = 3"]},
 {q:"Potongan output R:",pre:"K-means clustering with 3 clusters of sizes 1200, 2600, 1200",q2:"Berapa persen peserta yang masuk cluster 2?",o:["26%","52%","24%","60%"]},
 {q:"Pusat cluster (z-score) hasil K-Means:",pre:"Cluster means:\n   usia kunjungan biaya\n1  -0.8      -0.5  -0.4\n2   0.2       0.1   0.0\n3   1.3       1.6   2.1",q2:"Nama yang paling tepat untuk cluster 3 adalah …",o:["Peserta lebih tua, sering berobat, biaya tinggi","Peserta muda yang jarang berobat","Peserta dengan profil rata-rata","Tidak dapat ditentukan dari z-score"]},
 {q:"Pada dendrogram hasil hclust(), garis potong horizontal yang dipilih memotong 4 garis vertikal. Berapa cluster yang terbentuk?",o:["2","3","4","Bergantung jumlah observasi"]},
 {q:"Semua variabel bertipe kategorik: jenis kelamin, kelas rawat, dan provinsi. Metode clustering yang paling sesuai adalah …",o:["K-Means dengan jarak Euclidean","PCA","K-Modes, atau jarak Gower + PAM","Regresi logistik"]},
 {q:"Rata-rata silhouette untuk beberapa k:",pre:"k          :    2     3     4\nsilhouette : 0.31  0.58  0.44",q2:"Nilai k terbaik menurut silhouette adalah …",o:["k = 2","k = 4","Ketiganya sama baik","k = 3"]},
 {q:"PCA dilakukan pada 4 variabel yang sudah distandardisasi. Eigenvalue Dim1 = 2,4. Berapa persen variansi yang dijelaskan Dim1?",o:["24%","40%","60%","2,4%"]},
 {q:"Eigenvalue PCA pada 5 variabel terstandardisasi:",pre:"Dim.1 Dim.2 Dim.3 Dim.4 Dim.5\n  2.1   1.3   0.8   0.5   0.3",q2:"Menurut kriteria Kaiser (eigenvalue > 1), berapa dimensi yang dipertahankan?",o:["2","1","3","5"]},
 {q:"Loading Dim1 hasil PCA:",pre:"              PC1\nusia         0.60\nkunjungan    0.55\nbiaya        0.58\njarak_faskes 0.05",q2:"Nama yang paling tepat untuk Dim1 adalah …",o:["Jarak ke fasilitas kesehatan","Intensitas pemanfaatan layanan (usia, kunjungan, biaya)","Kontras usia muda vs tua","Dim1 tidak bermakna"]},
 {q:"Masih dengan loading pada soal 11, seorang peserta memiliki skor Dim1 = +3,2. Artinya peserta tersebut …",o:["Berusia muda dan jarang berobat","Tinggal jauh dari faskes","Memiliki profil rata-rata","Usia, kunjungan, dan biayanya di atas rata-rata"]},
 {q:"MCA (Multiple Correspondence Analysis) digunakan ketika variabel yang dianalisis …",o:["Semuanya kategorik","Semuanya numerik kontinu","Hanya satu variabel target","Berupa data deret waktu"]},
 {q:"Pada peta kategori MCA, titik “Kelas 1” dan “Hipertensi” berdekatan dan jauh dari titik pusat (0,0). Interpretasinya …",o:["Kedua kategori jarang ada di data","Kedua kategori cenderung muncul bersama pada peserta yang sama","Kedua kategori saling bertolak belakang","Kedua kategori adalah profil rata-rata"]},
 {q:"Output MCA menunjukkan Dim1 hanya menjelaskan 12% inertia. Pernyataan yang tepat adalah …",o:["MCA gagal dan harus diganti PCA","Data pasti salah input","Wajar pada MCA karena banyaknya kategori; tetap bisa diinterpretasi","Harus menambah variabel numerik"]}
],
posttest: [
 {q:"Manakah yang merupakan contoh tugas clustering?",o:["Memprediksi apakah klaim fraud menggunakan data berlabel","Mengelompokkan faskes berdasarkan kemiripan karakteristik tanpa label awal","Memperkirakan biaya klaim dari usia peserta","Menguji beda rata-rata biaya dua provinsi"]},
 {q:"Ringkasan data faskes:",pre:"  jml_peserta     rasio_rujukan    jml_dokter\n Min.   : 1000   Min.   :0.05    Min.   : 1\n Max.   :60000   Max.   :0.30    Max.   :25",q2:"Jika kmeans() dijalankan TANPA scale(), variabel mana yang paling mendominasi?",o:["rasio_rujukan","jml_dokter","Ketiganya setara","jml_peserta"]},
 {q:"Nilai total WSS untuk k = 1 sampai 6:",pre:"k   :   1    2    3    4    5    6\nWSS : 800  610  330  180  165  155",q2:"Berdasarkan metode elbow, jumlah cluster yang paling tepat adalah …",o:["k = 2","k = 4","k = 3","k = 6"]},
 {q:"Potongan output R:",pre:"K-means clustering with 3 clusters of sizes 450, 150, 900",q2:"Berapa persen faskes di cluster terkecil?",o:["10%","15%","30%","60%"]},
 {q:"Pusat cluster (z-score) faskes:",pre:"Cluster means:\n   jml_peserta rasio_rujukan jml_dokter\n1        -0.6           1.2       -0.7\n2         1.8          -0.3        1.5\n3        -0.1          -0.5       -0.2",q2:"Nama yang paling tepat untuk cluster 2 adalah …",o:["Faskes kecil dengan rujukan tinggi","Faskes dengan profil rata-rata","Faskes besar: banyak peserta dan dokter","Faskes dengan rujukan tertinggi"]},
 {q:"Kelebihan hierarchical clustering dibanding K-Means adalah …",o:["Selalu lebih cepat untuk data jutaan baris","Jumlah cluster tidak harus ditentukan di awal dan hasilnya bisa dilihat pada dendrogram","Tidak memerlukan perhitungan jarak","Hanya bisa untuk data kategorik"]},
 {q:"Variabel yang dipakai: usia (numerik), biaya klaim (numerik), kelas rawat (kategorik), dan segmen peserta (kategorik). Metode yang paling sesuai adalah …",o:["K-Means pada semua variabel apa adanya","MCA saja","Regresi linear","K-Prototypes, atau jarak Gower + PAM"]},
 {q:"Sebuah observasi memiliki nilai silhouette −0,20. Artinya …",o:["Observasi sangat cocok dengan cluster-nya","Observasi kemungkinan lebih dekat ke cluster lain (salah cluster)","Observasi berada tepat di pusat cluster","Jumlah cluster pasti terlalu sedikit"]},
 {q:"Output prcomp() pada 5 variabel terstandardisasi:",pre:"> round(res.pca$sdev, 2)\n[1] 1.50 1.10 0.90 0.60 0.47",q2:"Berapa persen variansi yang dijelaskan Dim1?",o:["30%","15%","45%","150%"]},
 {q:"Persentase variansi kumulatif PCA:",pre:"Dim.1 Dim.2 Dim.3 Dim.4 Dim.5\n   38    64    81    92   100",q2:"Berapa dimensi minimal agar variansi yang dijelaskan mencapai minimal 80%?",o:["3","2","4","5"]},
 {q:"Loading Dim2 hasil PCA:",pre:"              PC2\njarak_faskes 0.70\nkunjungan   -0.65\nusia         0.10\nbiaya       -0.08",q2:"Interpretasi Dim2 yang paling tepat adalah …",o:["Peserta tua vs muda","Biaya klaim tinggi vs rendah","Dim2 tidak bermakna","Tinggal jauh & jarang berkunjung vs dekat & sering berkunjung"]},
 {q:"Pada plot individu PCA, dua peserta terletak sangat berdekatan. Artinya …",o:["Profil kedua peserta mirip pada variabel-variabel yang dianalisis","Kedua peserta pasti berasal dari provinsi yang sama","Kedua peserta pasti tidak pernah klaim","Kedua peserta adalah outlier"]},
 {q:"Dataset mana yang paling cocok dianalisis dengan MCA?",o:["Usia, biaya klaim, lama rawat (semua numerik)","Jenis kelamin, kelas rawat, status kepesertaan, provinsi","Biaya klaim bulanan selama 5 tahun","Satu variabel biaya klaim"]},
 {q:"Pada peta kategori MCA, kategori “Perempuan” terletak sangat dekat dengan titik pusat (0,0). Interpretasinya …",o:["Kategori ini paling membedakan peserta","Kategori ini tidak ada di data","Kategori ini mewakili profil umum/rata-rata dan kurang membedakan","Kategori ini salah input"]},
 {q:"Output eta² (korelasi variabel dengan dimensi) MCA:",pre:"> round(res.mca$var$eta2[, 1], 2)\n  kelas_rawat jenis_kelamin        segmen\n         0.62          0.03          0.48",q2:"Variabel mana yang PALING TIDAK berkaitan dengan Dim1?",o:["jenis_kelamin","kelas_rawat","segmen","Semua sama kuat"]}
]};

const $ = id => document.getElementById(id);
let cur = null, ans = [];

$("gform").addEventListener("submit", e => {
  e.preventDefault();
  const t = PW[enc($("pw").value.trim())];
  if (!t) { $("gerr").textContent = "Password salah. Periksa kembali password dari trainer."; return; }
  cur = t; ans = Array(15).fill("");
  render();
  $("gate").classList.add("hide"); $("test").classList.remove("hide");
  window.scrollTo(0, 0);
});

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function render() {
  $("ttitle").textContent = TITLES[cur];
  document.title = TITLES[cur] + " · BPJS Data Analytics Training";
  $("qs").innerHTML = Q[cur].map((it, i) => `
    <div class="card q" id="q${i}">
      <p><span class="num">${i+1}.</span> ${esc(it.q)}</p>
      ${it.pre ? `<pre>${esc(it.pre)}</pre>` : ""}
      ${it.q2 ? `<p>${esc(it.q2)}</p>` : ""}
      ${it.o.map((o, j) => `<label class="opt" data-i="${i}"><input type="radio" name="q${i}" value="${"ABCD"[j]}"><span><b>${"ABCD"[j]}.</b> ${esc(o)}</span></label>`).join("")}
    </div>`).join("");
  $("qs").querySelectorAll("input").forEach(inp => inp.addEventListener("change", () => {
    const i = +inp.name.slice(1);
    ans[i] = inp.value;
    document.querySelectorAll(`#q${i} .opt`).forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
    progress();
  }));
}

function progress() {
  const n = ans.filter(Boolean).length;
  $("count").textContent = n + " / 15 terjawab";
  $("pbar").style.width = (n / 15 * 100) + "%";
}

function showReview(d) {
  $("review").innerHTML = Q[cur].map((it, i) => {
    const ok = ans[i] === d.key[i];
    return `<div class="card rv ${ok ? "ok" : "no"}">
      <p><span class="num">${i+1}.</span> ${esc(it.q)}</p>
      ${it.pre ? `<pre>${esc(it.pre)}</pre>` : ""}
      ${it.q2 ? `<p>${esc(it.q2)}</p>` : ""}
      ${it.o.map((o, j) => { const L = "ABCD"[j];
        const c = L === d.key[i] ? "k" : (L === ans[i] ? "w" : "");
        const m = L === d.key[i] ? " ✓ kunci" : (L === ans[i] ? " ✗ jawaban Anda" : "");
        return `<div class="opt ${c}"><span><b>${L}.</b> ${esc(o)}<i>${m}</i></span></div>`; }).join("")}
      <p class="pb"><span class="tag">${ok ? "Benar" : "Salah"}</span> · Jawaban Anda: ${ans[i]}, kunci: ${d.key[i]}. ${esc(d.expl[i] || "")}</p>
    </div>`;
  }).join("");
}

$("send").addEventListener("click", async () => {
  const nama = $("nama").value.trim(), email = $("email").value.trim();
  const err = $("terr"); err.textContent = "";
  if (!nama) { err.textContent = "Isi nama terlebih dahulu."; $("nama").focus(); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = "Isi email dengan format yang benar."; $("email").focus(); return; }
  const k = ans.findIndex(a => !a);
  if (k >= 0) { err.textContent = `Soal nomor ${k+1} belum dijawab.`; $("q"+k).scrollIntoView({behavior:"smooth"}); return; }
  if (SCRIPT_URL.startsWith("PASTE_")) { err.textContent = "SCRIPT_URL belum diisi di file HTML (lihat petunjuk trainer)."; return; }

  const btn = $("send"); btn.disabled = true; btn.textContent = "Mengirim…";
  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({test: cur, nama, email, answers: ans})
    });
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || "Gagal menyimpan");
    $("test").classList.add("hide"); $("done").classList.remove("hide");
    $("dmsg").textContent = `${TITLES[cur]} atas nama ${nama} sudah tercatat. Jawaban benar:`;
    $("dscore").textContent = `${d.correct} / ${d.total}  (skor ${d.score})`;
    showReview(d);
    window.scrollTo(0, 0);
  } catch (x) {
    err.textContent = "Pengiriman gagal. Periksa koneksi lalu coba lagi. Jawaban Anda masih tersimpan di halaman ini.";
    btn.disabled = false; btn.textContent = "Kumpulkan jawaban";
  }
});
</script>
</body>
</html>
